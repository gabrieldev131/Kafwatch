services:
  rtsp-proxy:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-proxy-server
    restart: unless-stopped
    ports:
    - 8554:8554
    - 8443:8443
    - 8888:8888
    volumes:
    - ./mediamtx.yml:/mediamtx.yml
    networks:
    - camera-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    networks:
    - camera-net
    restart: unless-stopped
    ports:
    - 9092:9092
    - 9094:9094
    tmpfs:
    - /var/lib/kafka/data:uid=1000,gid=1000,mode=1770,size=1g
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,LOCAL://:9094,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,LOCAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://10.145.80.60:9092,LOCAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_CLEANUP_POLICY: compact,delete
      KAFKA_LOG_RETENTION_MS: 300000
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_CLEANER_ENABLE: 'true'
      KAFKA_LOG_CLEANER_MIN_COMPACTION_LAG_MS: 0
      KAFKA_LOG_CLEANER_MAX_COMPACTION_LAG_MS: 30000
      KAFKA_LOG_CLEANER_DELETE_RETENTION_MS: 10000
      KAFKA_LOG_CLEANER_BACKOFF_MS: 2000
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
      KAFKA_LOG_SEGMENT_MS: 30000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000
      KAFKA_LOG_SEGMENT_DELETE_DELAY_MS: 1000
      KAFKA_OFFSETS_TOPIC_RETENTION_MINUTES: 5
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5242880
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
  worker-cam1:
    image: kafwatch-worker:latest
    build:
      context: ../worker_build
      dockerfile: Dockerfile
    container_name: worker-cam1
    restart: unless-stopped
    depends_on:
      rtsp-proxy:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
    - RTSP_URL=rtsp://rtsp-proxy:8554/cam1
    - CAMERA_ID=cam1
    - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
    - ./capturas:/app/capturas
    networks:
    - camera-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
  worker-cam2:
    image: kafwatch-worker:latest
    container_name: worker-cam2
    restart: unless-stopped
    depends_on:
      rtsp-proxy:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
    - RTSP_URL=rtsp://rtsp-proxy:8554/cam2
    - CAMERA_ID=cam2
    - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
    - ./capturas:/app/capturas
    networks:
    - camera-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
networks:
  camera-net:
    driver: bridge
